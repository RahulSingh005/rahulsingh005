<svg xmlns="http://www.w3.org/2000/svg" width="560" height="368" viewBox="0 0 560 368" role="img" aria-labelledby="title desc">
<title id="title">ReadWatch</title>
<desc id="desc">ReadWatch. Summarizes articles and YouTube videos with Gemini. A Chrome extension queues pages as you browse. 95% pages fetched, 17 REST endpoints, 3 services. Built with React, Express, MongoDB, Flask, Gemini.</desc>
<style>
.sans{font-family:'Segoe UI', -apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif}
.mono{font-family:ui-monospace, 'SF Mono', 'Cascadia Code', Consolas, Menlo, monospace}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.3}}
.pulse{animation:pulse 2.2s ease-in-out infinite}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}
</style>

<defs>
  <clipPath id="clip"><rect width="560" height="368" rx="22"/></clipPath>
  <radialGradient id="glow"><stop offset="0" stop-color="#A78BFA" stop-opacity="0.240"/>
    <stop offset="1" stop-color="#A78BFA" stop-opacity="0"/></radialGradient>
</defs>
<g clip-path="url(#clip)">
  <rect width="560" height="368" fill="#111824"/>
  <circle cx="520" cy="10" r="230" fill="url(#glow)"/>
</g>
<rect x=".5" y=".5" width="559" height="367" rx="22" fill="none" stroke="#223044"/>
<rect x="30" y="26" width="186.1" height="32" rx="9" fill="#A78BFA" fill-opacity=".12" stroke="#A78BFA" stroke-opacity=".35"/>
<text class="mono" x="44" y="47.5" font-size="15" font-weight="600" letter-spacing="1" fill="#A78BFA">AI · WEB PLATFORM</text>
<circle class="pulse" cx="483.9" cy="42" r="5" fill="#34D399"/>
<text class="sans" x="530" y="47.5" font-size="16" font-weight="600" text-anchor="end" fill="#93A1B5">Live</text>
<text class="sans" x="30" y="108" font-size="32" font-weight="700" letter-spacing="-.6" fill="#E8EDF5">ReadWatch</text>
<text class="sans" x="30" y="145" font-size="19.5" fill="#93A1B5">Summarizes articles and YouTube videos with Gemini.</text>
<text class="sans" x="30" y="172" font-size="19.5" fill="#93A1B5">A Chrome extension queues pages as you browse.</text>
<line x1="30" y1="198" x2="530" y2="198" stroke="#223044"/>
<text class="sans" x="30.0" y="250" font-size="36" font-weight="700" letter-spacing="-1" fill="#A78BFA">95%</text><text class="sans" x="30.0" y="276" font-size="17" fill="#93A1B5">pages fetched</text><text class="sans" x="196.7" y="250" font-size="36" font-weight="700" letter-spacing="-1" fill="#A78BFA">17</text><text class="sans" x="196.7" y="276" font-size="17" fill="#93A1B5">REST endpoints</text><text class="sans" x="363.3" y="250" font-size="36" font-weight="700" letter-spacing="-1" fill="#A78BFA">3</text><text class="sans" x="363.3" y="276" font-size="17" fill="#93A1B5">services</text>
<rect x="30.0" y="305" width="65.3" height="32" rx="16" fill="#162030" stroke="#223044"/><text class="sans" x="62.7" y="326" font-size="16" text-anchor="middle" fill="#E8EDF5">React</text><rect x="103.3" y="305" width="86.5" height="32" rx="16" fill="#162030" stroke="#223044"/><text class="sans" x="146.6" y="326" font-size="16" text-anchor="middle" fill="#E8EDF5">Express</text><rect x="197.8" y="305" width="86.5" height="32" rx="16" fill="#162030" stroke="#223044"/><text class="sans" x="241.0" y="326" font-size="16" text-anchor="middle" fill="#E8EDF5">MongoDB</text><rect x="292.3" y="305" width="65.3" height="32" rx="16" fill="#162030" stroke="#223044"/><text class="sans" x="324.9" y="326" font-size="16" text-anchor="middle" fill="#E8EDF5">Flask</text><rect x="365.6" y="305" width="70.1" height="32" rx="16" fill="#162030" stroke="#223044"/><text class="sans" x="400.6" y="326" font-size="16" text-anchor="middle" fill="#E8EDF5">Gemini</text>

