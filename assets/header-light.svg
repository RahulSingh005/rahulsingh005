<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="360" viewBox="0 0 1280 360" role="img" aria-labelledby="title desc">
<title id="title">Rahul Singh</title>
<desc id="desc">Full-stack developer, B.Tech IIT Roorkee 2026. Builds real-time web apps, Chrome extensions and LLM features. Available for SDE roles.</desc>
<style>
.sans{font-family:'Segoe UI', -apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif}
.mono{font-family:ui-monospace, 'SF Mono', 'Cascadia Code', Consolas, Menlo, monospace}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.3}}
.pulse{animation:pulse 2.2s ease-in-out infinite}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}

@keyframes cycle{0%{opacity:0;transform:translateY(8px)}4%,30%{opacity:1;transform:none}
34%,100%{opacity:0;transform:translateY(-8px)}}
.tick{opacity:0;animation:cycle 12s ease-in-out infinite}
.t0{opacity:1;animation-delay:-1s}.t1{animation-delay:3s}.t2{animation-delay:7s}
@keyframes spin{to{transform:rotate(360deg)}}
.orbit{transform-origin:1050px 180px;animation:spin 48s linear infinite}
</style>

<defs>
  <clipPath id="card"><rect width="1280" height="360" rx="24"/></clipPath>
  <pattern id="dots" width="26" height="26" patternUnits="userSpaceOnUse">
    <circle cx="2" cy="2" r="1.3" fill="#9AA6B8"/></pattern>
  <radialGradient id="fade" cx=".78" cy=".35" r=".75">
    <stop offset="0" stop-color="#fff" stop-opacity=".55"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></radialGradient>
  <mask id="dotmask"><rect width="1280" height="360" fill="url(#fade)"/></mask>
  <radialGradient id="glowV"><stop offset="0" stop-color="#7C3AED" stop-opacity="0.14"/>
    <stop offset="1" stop-color="#7C3AED" stop-opacity="0"/></radialGradient>
  <radialGradient id="glowC"><stop offset="0" stop-color="#0891B2" stop-opacity="0.098"/>
    <stop offset="1" stop-color="#0891B2" stop-opacity="0"/></radialGradient>
  <linearGradient id="name" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0" stop-color="#0F172A"/><stop offset=".55" stop-color="#7C3AED"/>
    <stop offset="1" stop-color="#0891B2"/></linearGradient>
  <linearGradient id="ring" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#7C3AED"/><stop offset="1" stop-color="#0891B2"/></linearGradient>
</defs>
<g clip-path="url(#card)">
  <rect width="1280" height="360" fill="#FCFCFE"/>
  <rect width="1280" height="360" fill="url(#dots)" mask="url(#dotmask)"/>
  <circle cx="1050" cy="60" r="420" fill="url(#glowV)"/>
  <circle cx="140" cy="380" r="380" fill="url(#glowC)"/>
</g>
<rect x=".5" y=".5" width="1279" height="359" rx="24" fill="none" stroke="#DCE2EC"/>

<rect x="72" y="44" width="282" height="42" rx="21" fill="#FFFFFF" stroke="#DCE2EC"/>
<circle class="pulse" cx="96" cy="65" r="6" fill="#059669"/>
<text class="sans" x="114" y="71.5" font-size="19" font-weight="600" fill="#0F172A">Available for SDE roles</text>

<text class="sans" x="68" y="172" font-size="84" font-weight="700" letter-spacing="-2.5" fill="url(#name)">Rahul Singh</text>
<text class="sans" x="72" y="220" font-size="24" fill="#536175">Full-stack developer · B.Tech, IIT Roorkee &#x27;26</text>
<text class="sans" x="72" y="252" font-size="24" fill="#536175">Real-time web apps, Chrome extensions and LLM features.</text>
<line x1="72" y1="280" x2="120" y2="280" stroke="url(#ring)" stroke-width="3" stroke-linecap="round"/>
<text class="mono tick t0" x="72" y="318" font-size="20"><tspan fill="#7C3AED" font-weight="600">now   </tspan><tspan fill="#0F172A">building BlinkChat: WebRTC calls and LLM summaries</tspan></text>
<text class="mono tick t1" x="72" y="318" font-size="20"><tspan fill="#7C3AED" font-weight="600">prev  </tspan><tspan fill="#0F172A">AI Trainer at Handshake AI, SDE intern at DNote</tspan></text>
<text class="mono tick t2" x="72" y="318" font-size="20"><tspan fill="#7C3AED" font-weight="600">stack </tspan><tspan fill="#0F172A">React · Node.js · MongoDB · Python · Flask</tspan></text>

<circle cx="1050" cy="180" r="150" fill="url(#glowV)"/>
<circle cx="1050" cy="180" r="132" fill="none" stroke="#DCE2EC" stroke-dasharray="2 9" stroke-linecap="round"/>
<g class="orbit">
  <circle cx="1182" cy="180" r="6" fill="#7C3AED"/>
  <circle cx="984" cy="294.3" r="4.5" fill="#0891B2"/>
  <circle cx="984" cy="65.7" r="4.5" fill="#059669"/>
</g>
<rect x="962" y="92" width="176" height="176" rx="44" fill="#FFFFFF" stroke="url(#ring)" stroke-width="2.5"/>
<text class="sans" x="1050" y="209" text-anchor="middle" font-size="82" font-weight="700" letter-spacing="-3" fill="url(#ring)">RS</text>

</svg>
