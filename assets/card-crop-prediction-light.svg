<svg xmlns="http://www.w3.org/2000/svg" width="560" height="368" viewBox="0 0 560 368" role="img" aria-labelledby="title desc">
<title id="title">Crop Prediction</title>
<desc id="desc">Crop Prediction. Recommends a crop from soil nutrients, pH and weather. Random Forest model served with Flask. 99.3% test accuracy, 22 crop classes, 7 input features. Built with Python, scikit-learn, Flask, Render.</desc>
<style>
.sans{font-family:'Segoe UI', -apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif}
.mono{font-family:ui-monospace, 'SF Mono', 'Cascadia Code', Consolas, Menlo, monospace}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.3}}
.pulse{animation:pulse 2.2s ease-in-out infinite}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}
</style>

<defs>
  <clipPath id="clip"><rect width="560" height="368" rx="22"/></clipPath>
  <radialGradient id="glow"><stop offset="0" stop-color="#059669" stop-opacity="0.112"/>
