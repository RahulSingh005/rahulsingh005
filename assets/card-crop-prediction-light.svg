<rect x="30" y="26" width="139.6" height="32" rx="9" fill="#059669" fill-opacity=".12" stroke="#059669" stroke-opacity=".35"/>
<text class="mono" x="44" y="47.5" font-size="15" font-weight="600" letter-spacing="1" fill="#059669">ML · WEB APP</text>
