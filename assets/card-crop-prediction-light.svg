<text class="sans" x="30" y="172" font-size="19.5" fill="#536175">weather. Random Forest model served with Flask.</text>
<line x1="30" y1="198" x2="530" y2="198" stroke="#DCE2EC"/>
<text class="sans" x="30.0" y="250" font-size="36" font-weight="700" letter-spacing="-1" fill="#059669">99.3%</text><text class="sans" x="30.0" y="276" font-size="17" fill="#536175">test accuracy</text><text class="sans" x="196.7" y="250" font-size="36" font-weight="700" letter-spacing="-1" fill="#059669">22</text><text class="sans" x="196.7" y="276" font-size="17" fill="#536175">crop classes</text><text class="sans" x="363.3" y="250" font-size="36" font-weight="700" letter-spacing="-1" fill="#059669">7</text><text class="sans" x="363.3" y="276" font-size="17" fill="#536175">input features</text>
