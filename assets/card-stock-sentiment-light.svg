<svg xmlns="http://www.w3.org/2000/svg" width="560" height="368" viewBox="0 0 560 368" role="img" aria-labelledby="title desc">
<title id="title">Stock Sentiment Analysis</title>
<desc id="desc">Stock Sentiment Analysis. Scores daily news sentiment with VADER and tests whether it helps predict GOOGL and MSFT prices. 46K headlines scored, 0.92 R² on GOOGL, 250 trading days. Built with Python, scikit-learn, Keras, VADER.</desc>
